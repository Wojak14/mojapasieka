// 🚀 START SYSTEMU

// 🌩️ AI STORM ALERT SYSTEM

function analyzeStormAlerts(weatherData){

  const box = document.getElementById("storm-alert-box");
  if(!box) return;

  if(!weatherData || !weatherData.today){
    box.innerHTML = "Brak danych pogodowych";
    return;
  }

  const wind = weatherData.today.wind || 0;
  const rain = weatherData.today.rain || 0;
  const temp = weatherData.today.temp || 0;

  let alerts = [];

  // 🌩️ BURZA / ULEWA
  if(rain >= 80){
    alerts.push("🌩️ Bardzo wysokie ryzyko ulewy");
  }
  else if(rain >= 50){
    alerts.push("🌧️ Możliwe silne opady");
  }

  // 💨 WIATR
  if(wind >= 45){
    alerts.push("💨 Bardzo silny wiatr");
  }
  else if(wind >= 25){
    alerts.push("🌬️ Uwaga na silny wiatr");
  }

  // ❄️ MRÓZ
  if(temp <= 5){
    alerts.push("❄️ Bardzo niska temperatura");
  }

  // 🥵 UPAŁ
  if(temp >= 32){
    alerts.push("🥵 Upał — ryzyko przegrzania uli");
  }

  // 🚨 FINAL AI STATUS
  let level = "";
  let color = "";

  const danger =
    rain >= 70 ||
    wind >= 40 ||
    temp <= 8;

  if(danger){
    level = "🚨 WYSOKIE ZAGROŻENIE";
    color = "#ff0000";
  }
  else if(alerts.length >= 1){
    level = "⚠️ UMIARKOWANE ZAGROŻENIE";
    color = "#ff9900";
  }
  else{
    level = "✅ WARUNKI DOBRE";
    color = "#008000";
  }

  // 🧠 REKOMENDACJE AI
  let recommendation = "";

  if(danger){
    recommendation =
      "⛔ NIE OTWIERAJ ULI i ogranicz wyjazdy do pasieki";
  }
  else if(alerts.length >= 1){
    recommendation =
      "👉 Zachowaj ostrożność podczas pracy";
  }
  else{
    recommendation =
      "🐝 Warunki dobre do pracy z pszczołami";
  }

  box.innerHTML = `
    <b>🌩️ Radar AI Pogody</b>

    <br><br>

    <span style="
      color:${color};
      font-weight:bold;
      font-size:16px;
    ">
      ${level}
    </span>

    <br><br>

    ${alerts.length ? alerts.join("<br>") : "Brak alertów pogodowych"}

    <br><br>

    <b>🧠 AI rekomendacja:</b><br>
    ${recommendation}

    <br><br>

    🌡️ Temperatura:
    <b>${temp}°C</b>

    <br>

    💨 Wiatr:
    <b>${wind} km/h</b>

    <br>

    🌧️ Opady:
    <b>${rain}%</b>
  `;
}

const firebaseConfig = {

};

// 🔥 INIT
const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

// =========================
// 🔥 FINAL BOSS CLOUD ENGINE
// =========================

window.cloudSaveNote =
async function(key, value){

  try{

    await setDoc(
      doc(db, "notes", key),
      {
        text: value,
        updated: Date.now()
      }
    );

    console.log("☁️ CLOUD SAVE OK");

  }catch(e){

    console.log("CLOUD SAVE ERROR", e);
  }
};

window.cloudLoadNote =
async function(key){

  try{

    const snap =
      await getDoc(
        doc(db, "notes", key)
      );

    if(snap.exists()){

      return snap.data().text || "";
    }

  }catch(e){

    console.log("CLOUD LOAD ERROR", e);
  }

  return "";
};

// 🔥 LIVE SYNC
window.startCloudSync =
function(key, callback){

  onSnapshot(
    doc(db, "notes", key),
    snap => {

      if(snap.exists()){

        callback(
          snap.data().text || ""
        );
      }
    }
  );
};

function getDistance(lat1, lon1, lat2, lon2){

  const R = 6371;

  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

    const data = await res.json();

function getBeeWorkAdvice(tempMin, tempMax, wind, rain){

  // 🔴 EKSTREMALNE WARUNKI
  if(tempMax < 10){
    return "❄️ Za zimno — nie otwieraj uli";
  }

  if(wind >= 35){

  }

    return "⛈️ Ulewny deszcz — prace niemożliwe";
  }

  // 🟠 ZŁE WARUNKI
  if(tempMax < 12){
    return "🥶 Zimno — tylko szybka kontrola";
  }

  if(rain >= 50){
    return "🌧️ Wysokie ryzyko opadów";
  }

  if(wind >= 20){
    return "💨 Silny wiatr — ostrożnie";
  }

  // 🟡 ŚREDNIE
  if(tempMax >= 12 && tempMax < 18){
    return "⚠️ Warunki średnie";
  }

  // 🟢 IDEALNE
  if(tempMax >= 18 && rain < 20 && wind < 15){
    return "🐝 Idealny dzień na przegląd";
  }

  // 🔵 DOBRE
  if(tempMax >= 15 && rain < 40){
    return "✅ Dobre warunki";
  }

  return "⚠️ Warunki zmienne";
}

function generateBeeForecast(days){

  let html = "<b>🐝 AI Prognoza Pasieczna:</b><br>";

  days.forEach(day => {

    const advice = getBeeWorkAdvice(
      day.tempMin,
      day.tempMax,
      day.wind,
      day.rain
    );

    const ai = analyzeWeatherDanger(day);

    if(ai.level === "danger"){
      bg = "#ffdddd";

    if(ai.level === "warning"){
      bg = "#fff3cd";

    if(ai.level === "perfect"){
      bg = "#d4edda";

    html += `
      <div style="
        margin:8px 0;

        background:${bg};

function analyzeWeatherDanger(day){

  const temp = day.tempMax || 0;
  const wind = day.wind || 0;
  const rain = day.rain || 0;

  let level = "good";
  let text = "✅ Idealne warunki";

  // 🔴 BLOKADA
  if(temp < 12 || wind >= 30 || rain >= 70){

    level = "danger";
    text = "⛔ NIE OTWIERAJ ULI";

  }

  // 🟠 ŚREDNIE
  else if(temp < 16 || wind >= 18 || rain >= 40){

    level = "warning";
    text = "⚠️ Ostrożnie z pracami";

  }

  // 🟢 IDEALNE
  else if(temp >= 18 && temp <= 28 && wind < 15 && rain < 20){

    level = "perfect";
    text = "🐝 IDEALNY DZIEŃ NA PRZEGLĄD";

  }

  return {
    level,
    text
  };
}

  if(month <= 7){

    return {

      risk: 70,

    };
  }

  if(month <= 9){

    return {
      season: "POŻYTEK PÓŹNY",
      risk: 30,

    };
  }

  return {

  };

function predictHoney(){

  const data = getHiveData();

  let total = 0;

  Object.values(data).forEach(h => {

    total += h.honey || 0;
  });

  const season =
    analyzeSeason();

  return Math.round(
    total +
    (season.nectar * 0.4)
  );
}

// 🔥 AI rojki
function predictSwarmRisk(){

  const data =
    getHiveData();

  let risk = 0;

  Object.values(data).forEach(h => {

    risk += h.swarm || 0;

    if(h.inspections === 0)
      risk += 15;

    if(h.honey > 20)
      risk += 10;
  });

  risk += analyzeSeason().risk;

  if(risk > 100) risk = 100;

  return Math.round(risk);
}

// 🔥 AI zdrowia
function analyzeHiveHealth(){

  const data =
    getHiveData();

  let strong = 0;
  let weak = 0;

  Object.values(data).forEach(h => {

    const score =
      (h.inspections*20) +
      (h.feeding*15) +
      (h.treatment*20) +
      (h.honey*10) -
      (h.swarm*20);

    if(score >= 50)
      strong++;
    else
      weak++;
  });

  return {
    strong,
    weak
  };
}

function calculateSwarmRiskAdvanced(note, weatherData){

  note = (note || "").toLowerCase();

  let risk = 0;

  const month = new Date().getMonth() + 1;

  // 🌸 SEZON ROJOWY
  if(month === 5) risk += 35;
  if(month === 6) risk += 40;
  if(month === 7) risk += 20;

  // 🌡 POGODA
  const temp =
    weatherData?.today?.temp || 20;

  const wind =
    weatherData?.today?.wind || 0;

  const rain =
    weatherData?.today?.rain || 0;

  if(temp >= 22) risk += 15;
  if(temp >= 26) risk += 15;

  if(wind < 12) risk += 10;

  if(rain < 20) risk += 10;

  // 🐝 ANALIZA NOTATEK
  if(note.includes("matka")) risk += 10;

  if(note.includes("czerw")) risk += 20;

  if(note.includes("dużo pszczół")) risk += 25;

  if(note.includes("ciasno")) risk += 30;

  if(note.includes("matecznik")) risk += 50;

  if(note.includes("rój")) risk += 60;

  // 🔍 BRAK PRZEGLĄDÓW
  if(!note.includes("przegląd")){
    risk += 20;
  }

  // 📦 BRAK MIEJSCA
  if(
    !note.includes("nadstawka") &&
    !note.includes("ramka")
  ){
    risk += 20;
  }

  // 🍯 DUŻY POŻYTEK
  if(
    note.includes("rzepak") ||
    note.includes("akacja") ||
    note.includes("lipa")
  ){
    risk += 15;
  }

  // LIMIT
  if(risk > 100) risk = 100;

  let level = "LOW";
  let text = "🟢 NISKIE";

  if(risk >= 70){
    level = "HIGH";
    text = "🔴 WYSOKIE";
  }
  else if(risk >= 40){
    level = "MEDIUM";
    text = "🟠 ŚREDNIE";
  }

  return {
    risk,
    level,
    text
  };
}

function getHiveProfile(hiveId){

    localStorage.getItem(key);

  if(saved){

    try{
      return JSON.parse(saved);
    }catch(e){}

  return {

    race: "Buckfast",

    strength: 50,

    aggression: 10,

    honey: 0,

    swarmRisk: 0,

    treatment: false,

    feeding: false,

    inspections: 0,

    notes: [],

    lastInspection: null
  };
}

function saveHiveProfile(profile){

  localStorage.setItem(
    "hive_profile_" + profile.id,
    JSON.stringify(profile)
  );
}

// 📊 ZBIERANIE DANYCH
function getHiveData(){

  let hiveStats = {};

  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(!/\d{2}\.\d{2}\.2026$/.test(key)) continue;

    const note = (localStorage.getItem(key)||"").toLowerCase();
    const matches = note.match(/ul\s*(\d+)/g);

    if(matches){
    const dateKey = key;
      matches.forEach(m=>{
        const nr = m.match(/\d+/)[0];
const hive =
  getHiveProfile(nr);

hive.notes.push({
  date: dateKey,
  text: note
saveHiveProfile(hive);
});

hive.lastInspection = dateKey;

        if(!hiveStats[nr]){
          hiveStats[nr] = {
            inspections:0,
            feeding:0,
            treatment:0,
            swarm:0,
            honey:0,
            score:0
          };
        }

        if(note.includes("przegląd")) hiveStats[nr].inspections++;
        hive.inspections++;
        hive.strength += 2;
        if(note.includes("karmienie")) hiveStats[nr].feeding++;
        hive.feeding = true;
        hive.strength += 3;
        if(note.includes("leczenie")) hiveStats[nr].treatment++;
        hive.treatment = true;
        if(note.includes("rój")) hiveStats[nr].swarm++;
        hive.swarmRisk += 25;
        hive.aggression += 5;
        if(note.includes("miód")) hiveStats[nr].honey++;
        hive.honey += 5;
      });
    }
  }

  return hiveStats;
}

// 🧠 AI HIVE HEALTH SYSTEM

function calculateHiveHealth(note){

  note = (note || "").toLowerCase();

  let score = 50;

  // 🟢 PLUSY
  if(note.includes("matka")) score += 10;
  if(note.includes("czerw")) score += 15;
  if(note.includes("miód")) score += 10;
  if(note.includes("karmienie")) score += 10;
  if(note.includes("leczenie")) score += 15;
  if(note.includes("silna rodzina")) score += 20;
  if(note.includes("dużo pszczół")) score += 20;
  if(note.includes("spokojne")) score += 10;

  // 🔴 MINUSY
  if(note.includes("rój")) score -= 20;
  if(note.includes("agresywne")) score -= 15;
  if(note.includes("brak matki")) score -= 40;
  if(note.includes("słaba rodzina")) score -= 30;
  if(note.includes("warroza")) score -= 35;
  if(note.includes("nosemoza")) score -= 40;
  if(note.includes("mało pszczół")) score -= 25;
  if(note.includes("głód")) score -= 30;
  if(note.includes("wilgoć")) score -= 15;

  // LIMIT
  if(score > 100) score = 100;
  if(score < 0) score = 0;

  let level = "good";
  let text = "🟢 SILNA";

  if(score < 70){
    level = "medium";
    text = "🟠 ŚREDNIA";
  }

  if(score < 40){
    level = "danger";
    text = "🔴 SŁABA";
  }

  return {
    score,
    level,
    text
  };
}

function createFullBackup(){

  const backup = {};

  for(let i=0;i<localStorage.length;i++){

    const key = localStorage.key(i);

    backup[key] = localStorage.getItem(key);
  }

  localStorage.setItem(
    "PASIEKA_BACKUP",
    JSON.stringify(backup)
  );

  console.log("💾 Backup zapisany");
}

// AUTO BACKUP co 5 minut
setInterval(createFullBackup, 300000);

function restoreBackup(){

  const raw = localStorage.getItem("PASIEKA_BACKUP");

  if(!raw) return;

  try{

    const backup = JSON.parse(raw);

    Object.keys(backup).forEach(key => {

      if(localStorage.getItem(key) === null){

        localStorage.setItem(
          key,
          backup[key]
        );
      }
    });

    console.log("♻️ Backup przywrócony");

  }catch(e){

    console.log("Błąd backupu", e);
  }
}

// =========================
// 📊 AI STATYSTYKI PASIEKI
// =========================

function generateApiaryStats(){

  const box = document.getElementById("apiary-stats");
  if(!box) return;

  let inspections = 0;
  let treatments = 0;
  let feeding = 0;
  let honey = 0;
  let swarms = 0;
  let allNotes = 0;

  for(let i=0;i<localStorage.length;i++){

    const key = localStorage.key(i);

    if(!key.includes(".2026")) continue;

    const note =
      (localStorage.getItem(key) || "")
      .toLowerCase();

    if(note.trim() !== ""){
      allNotes++;
    }

    if(note.includes("przegląd")) inspections++;
    if(note.includes("leczenie")) treatments++;
    if(note.includes("karmienie")) feeding++;
    if(note.includes("miód")) honey++;
    if(note.includes("rój")) swarms++;
  }

  // 📈 aktywność
  let activity = Math.min(
    100,
    inspections*3 +
    feeding*2 +
    treatments*3 +
    honey*2
  );

  let level = "🔴 NISKA";

  if(activity >= 70){
    level = "🟢 WYSOKA";
  }
  else if(activity >= 40){
    level = "🟡 ŚREDNIA";
  }

  // 🚨 AI alert
  let aiAlert = "✅ Pasieka stabilna";

  if(swarms >= 3){
    aiAlert = "🚨 WYSOKIE RYZYKO ROJKI";
  }
  else if(inspections === 0){
    aiAlert = "⚠️ Brak przeglądów";
  }
  else if(treatments === 0){
    aiAlert = "⚠️ Brak leczenia";
  }

  box.innerHTML = `
    <b>📊 Statystyki pasieki</b><br><br>

    🔍 Przeglądy: <b>${inspections}</b><br>
    🍯 Karmienia: <b>${feeding}</b><br>
    💊 Leczenia: <b>${treatments}</b><br>
    🫙 Miodobrania: <b>${honey}</b><br>
    🐝 Rójki: <b>${swarms}</b><br>
    📒 Wszystkie notatki: <b>${allNotes}</b><br><br>

    📈 Aktywność pasieki:
    <b>${activity}%</b><br>

    ${level}<br><br>

    🤖 AI:
    <b>${aiAlert}</b>
  `;
}

// 📤 EKSPORT
function exportApiaryData(){

  const data = {};

  for(let i=0;i<localStorage.length;i++){

    const key = localStorage.key(i);

    data[key] = localStorage.getItem(key);
  }

  const json = JSON.stringify(data, null, 2);

  const blob = new Blob(
    [json],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  const date = new Date();

  const filename =
    "pasieka-backup-" +
    date.getFullYear() + "-" +
    String(date.getMonth()+1).padStart(2,"0") + "-" +
    String(date.getDate()).padStart(2,"0") +
    ".json";

  a.href = url;
  a.download = filename;

  a.click();

  URL.revokeObjectURL(url);

  const box = document.getElementById("backup-status");

  if(box){
    box.innerHTML = "✅ Backup zapisany";
  }
}

// 📥 IMPORT
function importApiaryData(file){

  const reader = new FileReader();

  reader.onload = function(e){

    try{

      const data = JSON.parse(e.target.result);

      Object.keys(data).forEach(key => {
        localStorage.setItem(
          key,
          data[key]
        );
      });

      updateMarkers();

      if(typeof loadWeatherAndAssist === "function"){
        loadWeatherAndAssist();
      }

      const box = document.getElementById("backup-status");

      if(box){
        box.innerHTML = "✅ Backup przywrócony";
      }

      alert("Backup przywrócony");

    }catch(err){

      alert("Błąd importu backupu");

      console.log(err);
    }
  };

  reader.readAsText(file);
}

// 🔘 BUTTONY
const exportBtn = document.getElementById("exportDataBtn");
const importBtn = document.getElementById("importDataBtn");
const importFile = document.getElementById("importFile");

if(exportBtn){

  exportBtn.addEventListener(
    "click",
    exportApiaryData
  );
}

if(importBtn && importFile){

  importBtn.addEventListener("click", () => {
    importFile.click();
  });

  importFile.addEventListener("change", e => {

    const file = e.target.files[0];

    if(file){
      importApiaryData(file);
    }
  });
}

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasieka PRO - Next Level</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-128.png">

<style>
body{font-family:sans-serif;margin:0;padding:0;background:#fdf6e3;color:#333;}
h1,h2{margin:10px;}
table{border-collapse:collapse;width:100%;margin-bottom:1em;}
td,th{border:1px solid #aaa;padding:5px;text-align:center;}
.today{background:#fffa91;}
textarea{width:100%;height:100px;margin-top:5px;}
select{margin-top:5px;margin-bottom:5px;}
#weather-data,#location-box{margin:5px 0;}
button{margin:5px 0;padding:5px 10px;}
.hive-container{border:1px solid #aaa;padding:5px;margin-bottom:15px;}
.task-list{border:1px solid #aaa;padding:5px;margin-bottom:15px;}
canvas{max-width:100%;height:150px;margin-top:5px;}
</style>
</head>
<body>

<h1>Pasieka PRO - Next Level</h1>

<label>Rok: <input type="number" id="year-input" value="2026" min="2000" max="2100"></label>

<div id="location-box"></div>
<div id="weather-data"></div>

<div id="calendar-container"></div>

<h2>AI Pasieki</h2>
<div id="assistant-text" class="hive-container"></div>

<h2>Nadchodzące prace</h2>
<div class="task-list">
  <label><input type="checkbox" class="task-checkbox" data-task="Kontrola uli"> Kontrola uli</label><br>
  <label><input type="checkbox" class="task-checkbox" data-task="Sprawdzenie pokarmu"> Sprawdzenie pokarmu</label><br>
  <label><input type="checkbox" class="task-checkbox" data-task="Przegląd czerwiu"> Przegląd czerwiu</label><br>
  <button id="confirm-tasks-btn">✅ Potwierdź wykonanie</button>
</div>

<h2>Mini wykres tygodniowy (ramki/czerw/pokarm)</h2>
<canvas id="week-chart"></canvas>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

let textarea=null;
let currentDay=null;
let currentMonth=null;

// 🐝 TWOJE ULE
const HIVES = [2,3,4,5,8,10,11,13,14,15,16,17,19,20,21,22,23,26,27,28,30];

// ================== GENERATOR ULI ==================
document.querySelectorAll('[id^="hive-select-"]').forEach(select=>{
  select.innerHTML="";
  HIVES.forEach(h=>{
    const opt=document.createElement("option");
    opt.value=h;
    opt.textContent="Ul "+h;
    select.appendChild(opt);
  });
});

// ================== MARKERY ==================
function updateMarkers(){
  const today=new Date();
  const dNow=String(today.getDate()).padStart(2,"0");
  const mNow=String(today.getMonth()+1).padStart(2,"0");

  document.querySelectorAll(".day-number").forEach(span=>{
    const td=span.closest("td");
    td.classList.remove("today");

    const d=span.dataset.day.padStart(2,"0");
    const m=span.dataset.month.padStart(2,"0");

    if(d===dNow && m===mNow){
      td.classList.add("today");
    }
  });
}

// ================== KLIK DZIEŃ ==================
document.querySelectorAll(".day-number").forEach(span=>{
  span.addEventListener("click", ()=>{
    currentDay=span.dataset.day.padStart(2,"0");
    currentMonth=span.dataset.month.padStart(2,"0");

    const hive=document.getElementById("hive-select-"+currentMonth)?.value || HIVES[0];
    textarea=document.getElementById("notes-"+currentMonth);

    const key=currentDay+"."+currentMonth+".2026_ul_"+hive;

    if(textarea){
      textarea.value=localStorage.getItem(key)||"";
      textarea.focus();
    }

    updateHiveAI();
    updateWeekChart();
  });
});

// ================== ZMIANA ULA ==================
document.querySelectorAll('[id^="hive-select-"]').forEach(select=>{
  select.addEventListener("change", ()=>{
    if(!currentDay) return;

    const hive=select.value;
    const key=currentDay+"."+currentMonth+".2026_ul_"+hive;

    if(textarea){
      textarea.value=localStorage.getItem(key)||"";
    }

    updateHiveAI();
    updateWeekChart();
  });
});

// ================== ZAPIS ==================
window.saveNote=function(){
  if(!currentDay){ alert("Kliknij dzień"); return; }

  const hive=document.getElementById("hive-select-"+currentMonth)?.value || HIVES[0];
  const key=currentDay+"."+currentMonth+".2026_ul_"+hive;

  if(textarea){
    localStorage.setItem(key,textarea.value);
  }

  updateHiveAI();
  updateApiaryAI();
  updateWeekChart();
};

// ================== AI ULA ==================
function updateHiveAI(){

  if(!currentDay || !currentMonth) return;

  const hive=document.getElementById("hive-select-"+currentMonth)?.value || HIVES[0];
  const box=document.getElementById("hive-ai-"+currentMonth);
  if(!box) return;

  const key=currentDay+"."+currentMonth+".2026_ul_"+hive;
  const note=(localStorage.getItem(key)||"").toLowerCase();

  let frames=0, brood=0, food=0, pollen=0;
  let queen=true;

  const f=note.match(/(\d+)\s?ramek/); if(f) frames=parseInt(f[1]);
  const c=note.match(/(\d+)\s?czerw/); if(c) brood=parseInt(c[1]);
  const p=note.match(/(\d+)\s?pokarm/); if(p) food=parseInt(p[1]);
  const py=note.match(/(\d+)\s?pyłek/); if(py) pollen=parseInt(py[1]);

  if(note.includes("brak matki")) queen=false;

  let status="🟢 SILNY";
  if(frames<6 || brood<2) status="🔴 SŁABY";
  else if(frames<8) status="🟡 ŚREDNI";

  let alerts=[];
  if(!queen) alerts.push("🚨 brak matki");
  if(food<2) alerts.push("🍯 mało pokarmu");
  if(brood<2) alerts.push("🐝 mało czerwiu");

  let actions=[];
  if(frames>=8 && brood>=3) actions.push("⬆️ dodaj nadstawkę");
  if(frames<7) actions.push("🧱 dodaj węzę");
  if(brood>=4) actions.push("🐝 ramka pracy");
  if(!queen) actions.push("👑 poddaj matkę");

  box.innerHTML=`
  <b>🐝 Ul ${hive}</b><br>
  Status: <b>${status}</b><br>
  Ramki:${frames} | Czerw:${brood} | Pokarm:${food} | Pyłek:${pollen}<br><br>
  <b>⚠️ Alerty:</b><br>${alerts.join("<br>")||"brak"}<br><br>
  <b>🛠 Zalecenia:</b><br>${actions.join("<br>")||"brak"}
  `;
}

// ================== AI PASIEKI ==================
function updateApiaryAI(){

  const box=document.getElementById("assistant-text");
  if(!box) return;

  const today=new Date();
  const m=String(today.getMonth()+1).padStart(2,"0");

  let weak=0,strong=0,noQueen=0;

  HIVES.forEach(h=>{
    for(let d=1;d<=31;d++){
      const key=String(d).padStart(2,"0")+"."+m+".2026_ul_"+h;
      const note=(localStorage.getItem(key)||"").toLowerCase();

      if(!note) continue;

      if(note.includes("brak matki")) noQueen++;

      const frames=(note.match(/(\d+)\s?ramek/)||[])[1]||0;
      const brood=(note.match(/(\d+)\s?czerw/)||[])[1]||0;

      if(frames<6 || brood<2) weak++;
      else if(frames>=8 && brood>=3) strong++;
    }
  });

  box.innerHTML=`
  <b>🐝 AI PASIEKI</b><br><br>
  🟢 Silne: ${strong}<br>
  🔴 Słabe: ${weak}<br>
  👑 Bez matki: ${noQueen}<br><br>
  ${weak>5 ? "⚠️ Dużo słabych rodzin!" : ""}
  ${noQueen>0 ? "🚨 Są ule bez matki!" : ""}
  `;
}

// ================== Nadchodzące prace ==================
document.getElementById("confirm-tasks-btn").addEventListener("click",()=>{
  document.querySelectorAll(".task-checkbox").forEach(cb=>{
    if(cb.checked){
      alert(`✅ Zadanie "${cb.dataset.task}" wykonane!`);
      cb.checked=false;
    }
  });
});

// ================== POGODA ==================
function loadWeather(){

  const box=document.getElementById("weather-data");
  const loc=document.getElementById("location-box");

  function fetchWeather(lat,lon){
    if(isNaN(lat)||isNaN(lon)){lat=52.24;lon=23.09;}

    if(loc) loc.innerHTML=`📍 ${lat.toFixed(3)}, ${lon.toFixed(3)}`;

    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
    .then(r=>r.json())
    .then(data=>{
      const t=data.current_weather?.temperature||0;
      const w=data.current_weather?.windspeed||0;
      if(box) box.innerHTML=`🌡 ${t}°C | 💨 ${w} km/h`;
    });
  }

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>fetchWeather(pos.coords.latitude,pos.coords.longitude),
      ()=>fetchWeather(52.24,23.09)
    );
  } else fetchWeather(52.24,23.09);
}

// ================== AUTO REFRESH ==================
setInterval(loadWeather,120000);

// ================== TODAY ==================
function scrollToToday(){
  const t=new Date();
  const d=String(t.getDate()).padStart(2,"0");
  const m=String(t.getMonth()+1).padStart(2,"0");

  const el=document.querySelector(`.day-number[data-day="${d}"][data-month="${m}"]`);
  if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
}

// ================== WEEK CHART ==================
let weekChart;
function updateWeekChart(){
  const ctx=document.getElementById("week-chart").getContext("2d");
  const labels=[];
  const framesData=[],broodData=[],foodData=[];
  const today=new Date();
  for(let i=6;i>=0;i--){
    const d=new Date(today); d.setDate(today.getDate()-i);
    const day=String(d.getDate()).padStart(2,"0");
    const month=String(d.getMonth()+1).padStart(2,"0");
    labels.push(`${day}.${month}`);
    let frames=0, brood=0, food=0;
    HIVES.forEach(h=>{
      const key=day+"."+month+".2026_ul_"+h;
      const note=(localStorage.getItem(key)||"").toLowerCase();
      frames+=parseInt((note.match(/(\d+)\s?ramek/)||[])[1]||0);
      brood+=parseInt((note.match(/(\d+)\s?czerw/)||[])[1]||0);
      food+=parseInt((note.match(/(\d+)\s?pokarm/)||[])[1]||0);
    });
    framesData.push(frames);
    broodData.push(brood);
    foodData.push(food);
  }
  if(weekChart) weekChart.destroy();
  weekChart=new Chart(ctx,{
    type:"line",
    data:{
      labels:labels,
      datasets:[
        {label:"Ramki",data:framesData,borderColor:"orange",fill:false},
        {label:"Czerw",data:broodData,borderColor:"red",fill:false},
        {label:"Pokarm",data:foodData,borderColor:"green",fill:false}
      ]
    }
  });
}

// ================== START ==================
updateMarkers();
updateApiaryAI();
scrollToToday();
loadWeather();
updateWeekChart();

});
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js')
  .then(()=>console.log("Service Worker zarejestrowany"))
  .catch(err=>console.log("Błąd SW:", err));
}
</script>

</body>
</html>
